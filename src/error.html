<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Error %sveltekit.status% · Dolmo</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: 'Inter Variable', system-ui, sans-serif;
				background: oklch(1 0 0);
				color: oklch(0.145 0 0);
			}
			@media (prefers-color-scheme: dark) {
				:root {
					background: oklch(0.145 0 0);
					color: oklch(0.985 0 0);
				}
			}
			main {
				display: flex;
				min-height: 100svh;
				max-width: 28rem;
				margin: 0 auto;
				padding: 0 1rem;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1rem;
				text-align: center;
			}
			h1 {
				margin: 0;
				font-size: 1.5rem;
			}
			p {
				margin: 0;
				opacity: 0.75;
			}
			a {
				color: inherit;
				font-weight: 500;
			}
		</style>
	</head>
	<body>
		<main>
			<p>Error %sveltekit.status%</p>
			<h1>Something went wrong</h1>
			<p>Dolmo ran into a problem on its side. Reload the page or try again in a moment.</p>
			<a href="/">Back to Dolmo</a>
		</main>
	</body>
</html>
